name: Completion regression probe
on:
  push:
    branches: [fix/highlighted-completion-menu]
permissions:
  contents: read
jobs:
  completion:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 Tests/Shell/test_pty.py CompletionTests.test_arrow_navigation_selects_exact_nonfirst_candidate
