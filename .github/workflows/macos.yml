name: macOS MVP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
concurrency:
  group: terminal-helper-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Environment
        run: |
          mkdir -p results dist
          sw_vers > results/environment.txt
          uname -m >> results/environment.txt
          sysctl -n machdep.cpu.brand_string >> results/environment.txt
          /bin/zsh --version >> results/environment.txt
          swift --version >> results/environment.txt
      - name: Shell syntax
        run: for script in Integration/*.zsh; do /bin/zsh -n "$script"; done
      - name: Installer tests
        run: python3 Tests/Shell/test_install.py 2>&1 | tee results/install-tests.txt
      - name: Terminal management command tests
        if: always() && !cancelled()
        run: python3 Tests/Shell/test_cli.py 2>&1 | tee results/cli-tests.txt
      - name: Native update boundary tests
        if: always() && !cancelled()
        run: |
          swiftc App/State.swift App/Updates.swift App/UpdateInstaller.swift Tests/Updates/main.swift -o build-update-tests -framework AppKit -framework CoreServices
          ./build-update-tests | tee results/update-tests.txt
      - name: ZLE tests
        if: always() && !cancelled()
        run: python3 Tests/Shell/test_pty.py 2>&1 | tee results/shell-tests.txt
      - name: Case-sensitive filesystem
        if: always() && !cancelled()
        run: |
          case_root=$(mktemp -d "$RUNNER_TEMP/terminal-helper-case.XXXXXX")
          case_mount="$case_root/mount"
          mkdir "$case_mount"
          cleanup_case() {
            hdiutil detach "$case_mount" >/dev/null 2>&1 || true
            rm -f "$case_root/fixture.dmg"
          }
          trap cleanup_case EXIT
          hdiutil create -size 64m -fs HFSX -volname THCaseSensitive "$case_root/fixture.dmg" >/dev/null
          hdiutil attach -owners on -nobrowse -mountpoint "$case_mount" "$case_root/fixture.dmg" >/dev/null
          mkdir "$case_mount/tmp"
          TMPDIR="$case_mount/tmp" python3 Tests/Shell/test_pty.py CompletionTests.test_case_sensitive_fixture 2>&1 | tee results/case-sensitive-tests.txt
      - name: Terminal.app interaction smoke
        if: always() && !cancelled()
        run: python3 Tests/Shell/test_terminal.py | tee results/terminal-native.json
      - name: Build universal app
        id: build
        if: always() && !cancelled()
        run: bash Scripts/build.sh
      - name: App version command
        if: always() && !cancelled() && steps.build.outcome == 'success'
        run: |
          actual=$("dist/Terminal Helper.app/Contents/MacOS/TerminalHelper" --version)
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' 'dist/Terminal Helper.app/Contents/Info.plist')
          test "$actual" = "Terminal Helper $version"
          printf '%s\n' "$actual" | tee results/version-tests.txt
      - name: App state tests
        if: always() && !cancelled() && steps.build.outcome == 'success'
        run: '"dist/Terminal Helper.app/Contents/MacOS/TerminalHelper" --self-test | tee results/app-tests.txt'
      - name: Native Settings tests
        if: always() && !cancelled() && steps.build.outcome == 'success'
        run: '"dist/Terminal Helper.app/Contents/MacOS/TerminalHelper" --settings-self-test | tee results/settings-tests.txt'
      - name: Controller lifecycle test
        if: always() && !cancelled() && steps.build.outcome == 'success'
        run: '"dist/Terminal Helper.app/Contents/MacOS/TerminalHelper" --lifecycle-test | tee results/lifecycle-tests.txt'
      - name: Completion timing
        if: always() && !cancelled()
        run: python3 Tests/Shell/test_pty.py --benchmark | tee results/completion-timing.json
      - name: Unconfigured first Tab timing
        if: always() && !cancelled()
        run: python3 Tests/Shell/test_pty.py --benchmark-uninitialized | tee results/completion-uninitialized.json
      - name: Performance and native smoke test
        if: always() && !cancelled() && steps.build.outcome == 'success'
        run: python3 Tests/Performance/measure.py
      - name: Package test build
        if: always() && !cancelled() && steps.build.outcome == 'success'
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' 'dist/Terminal Helper.app/Contents/Info.plist')
          ditto -c -k --sequesterRsrc --keepParent 'dist/Terminal Helper.app' "dist/Terminal-Helper-${version}-${SOURCE_SHA:0:12}-universal.zip"
          bash Scripts/package.sh
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
          du -sh 'Terminal Helper.app' >> ../results/environment.txt
          lipo -archs 'Terminal Helper.app/Contents/MacOS/TerminalHelper' >> ../results/environment.txt
          codesign -dv 'Terminal Helper.app' 2>> ../results/environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Terminal-Helper-${{ matrix.runner }}-${{ env.SOURCE_SHA }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.dmg.sha256
            dist/SHA256SUMS.txt
            results/
          if-no-files-found: error
          retention-days: 14
